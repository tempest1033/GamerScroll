name: Build and Deploy AIScroll

on:
  push:
    branches: [main]
    paths:
      - 'data/tech/**'
      - 'reports/issue/**'
      - 'data/wiki/**'
      - 'reports/hotpick/**'
      - 'generate-ai-blog.js'
      - 'src/templates/ai-blog/**'
      - 'src/templates/layout/**'
      - 'src/ai-blog/**'
      - 'src/styles/**'
      - 'src/build/**'
      - 'ai-build-cache.js'
      - 'functions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-aiscroll
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build AIScroll
        env:
          AISCROLL_GA4_PROPERTY_ID: ${{ secrets.AISCROLL_GA4_PROPERTY_ID }}
          AISCROLL_GA4_SERVICE_ACCOUNT: ${{ secrets.AISCROLL_GA4_SERVICE_ACCOUNT }}
          ADS_ENABLED: 'true'
        run: node generate-ai-blog.js

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # HARD INVARIANT: pathspec-restricted stash (artifacts only).
          git stash push -u -m "ai-build-artifacts" -- ai-docs/ .ai-build-cache.json data/ reports/ functions/ || true
          git pull origin main --rebase
          if git stash list | grep -q "ai-build-artifacts"; then
            if ! git stash pop; then
              # ai-docs/, .ai-build-cache.json, functions/는 우리 새 산출물 우선(--theirs는 stash 결과).
              # data/, reports/ 같은 user-content path에서 conflict이 남으면 abort.
              echo "::warning::stash pop conflict — resolving artifact paths with stash version"
              git checkout --theirs ai-docs/ .ai-build-cache.json functions/ 2>/dev/null || true
              git add ai-docs/ .ai-build-cache.json functions/ 2>/dev/null || true
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::unresolved conflict outside artifact paths — aborting"
                git diff --name-only --diff-filter=U
                exit 1
              fi
              git stash drop 2>/dev/null || true
            fi
          fi
          git add ai-docs/ data/tech/ reports/issue/ data/wiki/ reports/hotpick/ functions/ -f
          git diff --staged --quiet || git commit -m "Build AIScroll $(date +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "::warning::push attempt $attempt failed; rebasing + rebuilding to keep stale-artifact invariant"
            git pull origin main --rebase || exit 1
            # 새 main 위에 stale 산출물이 올라가는 것 방지: 빌드 재실행 후 재 스테이지.
            node generate-ai-blog.js || exit 1
            git add ai-docs/ data/tech/ reports/issue/ data/wiki/ reports/hotpick/ functions/ -f
            git diff --staged --quiet || git commit --amend --no-edit
          done
          echo "::error::push failed after 3 retries"
          exit 1
