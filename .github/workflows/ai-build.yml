name: Build and Deploy AIScroll

on:
  push:
    branches: [main]
    paths:
      - 'data/tech/**'
      - 'reports/issue/**'
      - 'data/wiki/**'
      - 'reports/hotpick/**'
      - 'generate-ai-blog.js'
      - 'src/templates/ai-blog/**'
      - 'src/templates/layout/**'
      - 'src/ai-blog/**'
      - 'src/styles/**'
      - 'src/build/**'
      - 'ai-build-cache.js'
      - 'functions/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-aiscroll
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build AIScroll
        env:
          AISCROLL_GA4_PROPERTY_ID: ${{ secrets.AISCROLL_GA4_PROPERTY_ID }}
          AISCROLL_GA4_SERVICE_ACCOUNT: ${{ secrets.AISCROLL_GA4_SERVICE_ACCOUNT }}
          ADS_ENABLED: 'true'
        run: node generate-ai-blog.js

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # HARD INVARIANT: pathspec-restricted stash (artifacts only).
          git stash push -u -m "ai-build-artifacts" -- ai-docs/ .ai-build-cache.json data/ reports/ functions/ wrangler.toml || true
          git pull origin main --rebase
          if git stash list | grep -q "ai-build-artifacts"; then
            if ! git stash pop; then
              echo "::error::stash pop conflict — manual resolve required, aborting"
              exit 1
            fi
          fi
          git add ai-docs/ data/tech/ reports/issue/ data/wiki/ reports/hotpick/ functions/ wrangler.toml -f
          git diff --staged --quiet || git commit -m "Build AIScroll $(date +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "::warning::push attempt $attempt failed; rebasing"
            git pull origin main --rebase || exit 1
          done
          echo "::error::push failed after 3 retries"
          exit 1
