name: Generate AI Insight

on:
  schedule:
    - cron: '0 21 * * *'  # 하루 1번 (UTC 21:00 → KST 06:00)
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: ai-insight
  cancel-in-progress: false

jobs:
  generate-insight:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull origin main --rebase || true

      - name: Check cache file
        id: check-cache
        run: |
          if [ -f "data-cache.json" ]; then
            echo "cache_exists=true" >> $GITHUB_OUTPUT
            echo "📂 캐시 파일 존재 확인"
          else
            echo "cache_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ 캐시 파일 없음 - build 워크플로우가 먼저 실행되어야 합니다"
          fi

      - name: Setup Node.js
        if: steps.check-cache.outputs.cache_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check-cache.outputs.cache_exists == 'true'
        run: npm install --production

      - name: Generate AI Insight
        if: steps.check-cache.outputs.cache_exists == 'true'
        run: |
          export PATH="/Users/jyp/.local/bin:/opt/homebrew/bin:$PATH"
          echo "🤖 AI 인사이트 생성 시작..."
          node generate-ai-insight.js
        timeout-minutes: 30

      - name: Finalize AI thumbnails (Codex)
        if: steps.check-cache.outputs.cache_exists == 'true'
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "🖼️ AI 썸네일 후처리(Codex) 시작..."
          command -v codex >/dev/null 2>&1 || { echo "❌ codex CLI가 설치되어 있지 않습니다"; exit 1; }
          TARGET_FILE="$(node - <<-'NODE'
          const fs = require('fs');
          const path = require('path');

          const kst = new Date(Date.now() + 9 * 60 * 60 * 1000);
          const date = kst.toISOString().slice(0, 10);
          const candidates = [
            `reports/${date}.json`,
            `reports/${date}-AM.json`,
            `reports/${date}-PM.json`,
          ];

          const existing = candidates.find(f => fs.existsSync(f));
          if (existing) {
            console.log(existing);
            process.exit(0);
          }

          if (fs.existsSync('reports')) {
            const files = fs.readdirSync('reports')
              .filter(f => /^\d{4}-\d{2}-\d{2}(-[AP]M)?\.json$/.test(f))
              .map(f => path.join('reports', f));
            files.sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs);
            if (files[0]) {
              console.log(files[0]);
              process.exit(0);
            }
          }

          console.error('No report file found');
          process.exit(1);
          	NODE
          )"
          echo "🎯 대상 리포트: $TARGET_FILE"
          cat <<-PROMPT | codex exec -m gpt-5.3-codex -c model_reasoning_effort=xhigh -c hide_agent_reasoning=true --dangerously-bypass-approvals-and-sandbox -
          다음 JSON 파일의 썸네일 URL을 웹 검색으로 정확히 채워주세요.
          파일: ${TARGET_FILE}

          대상 필드(이외 수정 금지):
          - ai.thumbnail
          - ai.issues[].thumbnail
          - ai.industryIssues[].thumbnail
          - ai.metrics[].thumbnail

          규칙:
          - thumbnail은 반드시 https:// 로 시작하는 절대 URL만 사용(// 금지)
          - 제목/내용과 확실히 일치하는 기사/공식 이미지만 사용하고, 애매하면 null 유지
          - 다른 필드/키 순서/서식은 건드리지 말 것
          - git 명령은 절대 실행하지 말 것
          	PROMPT
        timeout-minutes: 30

      - name: Move reports to docs
        if: steps.check-cache.outputs.cache_exists == 'true'
        run: |
          mkdir -p docs/reports
          if [ -d "reports" ]; then
            cp -r reports/*.json docs/reports/ 2>/dev/null || true
            cp -r reports/*.html docs/reports/ 2>/dev/null || true
          fi

      - name: Commit and push
        if: steps.check-cache.outputs.cache_exists == 'true'
        run: |
          # 먼저 stash하고 pull
          git stash --include-untracked || true
          git pull origin main --rebase || true
          git stash pop || true
          # 그 다음 add & commit
          git add reports/ docs/reports/
          if git diff --staged --quiet; then
            echo "📝 변경사항 없음"
          else
            git commit -m "AI Insight $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ AI 인사이트 푸시 완료"
          fi
