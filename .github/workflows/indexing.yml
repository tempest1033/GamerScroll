name: IndexNow submission

# Ping IndexNow (Bing/Yandex/Seznam/Naver) with newly approved article URLs
# after every push to main. The script inspects the diff between HEAD~1 and
# HEAD; only JSON files under the article roots whose `status` is `approved`
# are sent, filtered to the gamerscroll.com host (its IndexNow key lives at
# docs/<KEY>.txt). Google discovery is NOT handled here — it relies on the XML
# sitemap + Search Console (one-time manual sitemap submission by the owner).
# Manual dispatch is supported with a custom diff range or explicit URL list.

on:
  push:
    branches: [main]
    paths:
      - 'data/tech/ai/**.json'
      - 'data/tech/vibecoding/**.json'
      - 'data/tech/normal/**.json'
      - 'data/wiki/**.json'
      - 'reports/issue/**.json'
      - 'reports/hotpick/**.json'
  # Daily sitemap ping, 02:30 UTC: only the sitemap URLs whose <lastmod> changed since the last successful submission
  # (state kept in the Actions cache below; a missing cache submits every sitemap URL once).
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'articles = changed article JSON / URL list; sitemap = gamerscroll.com sitemap URLs whose lastmod changed since the last submission'
        required: false
        default: 'articles'
        type: choice
        options:
          - articles
          - sitemap
      urls:
        description: 'Newline-separated URLs to submit (overrides diff detection)'
        required: false
        type: string
      diff_range:
        description: 'git diff range to scan (default HEAD~1..HEAD)'
        required: false
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full history; multi-commit push에서 github.event.before..sha 정확히 scan
          fetch-depth: 0
          # blobless 부분 클론: 히스토리(트리·커밋)는 전부 받되 blob은 HEAD 체크아웃분만.
          # 매 30분 CI가 docs/ 전체를 커밋하는 히스토리의 blob 다운로드(수 GB, 10분+)를
          # 건너뛴다. submit-indexing.mjs는 git diff --name-only(트리만 필요)와 변경
          # 기사 JSON 읽기만 수행. (sparse-checkout은 filter와 병용 시 무시되므로 미사용)
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore last sitemap submission
        id: state
        if: github.event_name == 'schedule' || inputs.mode == 'sitemap'
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-sitemap-${{ github.run_id }}
          restore-keys: indexnow-sitemap-
      - name: Submit URLs to IndexNow
        # IndexNow non-2xx is warned but never fails the run (script exits 0).
        continue-on-error: true
        env:
          # schedule -> sitemap mode; dispatch -> inputs.mode; push -> articles
          INDEXING_MODE: ${{ (github.event_name == 'schedule' && 'sitemap') || inputs.mode || 'articles' }}
          INDEXING_STATE: .indexnow-state.json
          INDEXING_URLS: ${{ inputs.urls }}
          # push event: github.event.before..sha (전체 새 커밋 누락 없이 scan)
          # workflow_dispatch: inputs.diff_range 우선, 없으면 HEAD~1..HEAD
          INDEXING_DIFF_RANGE: ${{ inputs.diff_range || (github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha)) || 'HEAD~1..HEAD' }}
        run: node scripts/submit-indexing.mjs
      - name: Save sitemap submission state
        # The script rewrites the state only after a successful submission; an unchanged file is saved under the new key too.
        if: steps.state.outcome == 'success' && hashFiles('.indexnow-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-sitemap-${{ github.run_id }}
