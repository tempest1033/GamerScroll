name: X Daily Post

on:
  workflow_dispatch:  # 수동 실행만 가능 (일간 리포트 자동 트리거 제거)

permissions:
  contents: write

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check today's AI insight exists
        run: |
          TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          REPORT="docs/reports/${TODAY}.json"
          REPORT_SRC="reports/${TODAY}.json"

          # docs/reports에서 먼저 확인
          if [ -f "$REPORT" ] && node -e "const r=JSON.parse(require('fs').readFileSync('$REPORT','utf8')); if(r.ai){process.exit(0)}else{process.exit(1)}"; then
            echo "✅ 오늘자 AI 인사이트 확인 (docs/reports): $REPORT"
          elif [ -f "$REPORT_SRC" ] && node -e "const r=JSON.parse(require('fs').readFileSync('$REPORT_SRC','utf8')); if(r.ai){process.exit(0)}else{process.exit(1)}"; then
            echo "✅ 오늘자 AI 인사이트 확인 (reports): $REPORT_SRC"
            echo "REPORT_PATH=$REPORT_SRC" >> $GITHUB_ENV
          else
            echo "❌ 오늘자 AI 인사이트 없음"
            exit 1
          fi

      - name: Generate X card image
        run: npm run x-card

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run x-post

      - name: Commit X card image
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/images/
          git diff --staged --quiet || git commit -m "Update X card $(date +'%Y-%m-%d')"
          # 충돌 시 재시도 로직
          for i in 1 2 3; do
            git pull origin main --rebase && git push && break
            echo "Push 실패, 재시도 $i/3..."
            sleep 5
          done
