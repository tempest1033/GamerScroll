name: X Article Post (AIScroll EN)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article slug (e.g., gacha-item-relief-center)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: x-article-post-aiscroll
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate article card (EN)
        run: npm run x-article-card-en -- ${{ inputs.slug }}

      - name: Post to X (AIScroll EN)
        env:
          AISCROLL_API_KEY: ${{ secrets.AISCROLL_API_KEY }}
          AISCROLL_API_SECRET: ${{ secrets.AISCROLL_API_SECRET }}
          AISCROLL_ACCESS_TOKEN: ${{ secrets.AISCROLL_ACCESS_TOKEN }}
          AISCROLL_ACCESS_SECRET: ${{ secrets.AISCROLL_ACCESS_SECRET }}
        run: npm run x-article-post-en -- ${{ inputs.slug }}

      - name: Commit card image
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/images/
          git diff --staged --quiet || git commit -m "Update AIScroll article X card $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull origin main --rebase && git push && break
            echo "Push failed, retry $i/3..."
            sleep 5
          done
