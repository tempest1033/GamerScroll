name: Build AIScroll

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout GamerScroll
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check for untranslated articles
        id: check-translate
        run: |
          NEED_TRANSLATE=$(node -e "
            const fs = require('fs');
            const path = require('path');
            let need = false;

            // data/tech/ai/*.json 체크 (needTranslate가 false가 아니면 번역 필요)
            const aiDir = 'data/tech/ai';
            if (fs.existsSync(aiDir)) {
              fs.readdirSync(aiDir).filter(f => f.endsWith('.json')).forEach(f => {
                const data = JSON.parse(fs.readFileSync(path.join(aiDir, f), 'utf8'));
                if (data.needTranslate !== false) {
                  need = true;
                }
              });
            }

            // reports/issue/*.json 체크
            const issueDir = 'reports/issue';
            const extras = ['gpt-5-3-garlic-update-rumor', 'chatgpt-vs-gemini-comparison-2026', 'gemini-3-hallucination-memory-overfitting'];
            if (fs.existsSync(issueDir)) {
              extras.forEach(slug => {
                const f = path.join(issueDir, slug + '.json');
                if (fs.existsSync(f)) {
                  const data = JSON.parse(fs.readFileSync(f, 'utf8'));
                  if (data.needTranslate !== false) need = true;
                }
              });
            }

            console.log(need ? 'true' : 'false');
          ")
          echo "need_translate=$NEED_TRANSLATE" >> $GITHUB_OUTPUT
          if [ "$NEED_TRANSLATE" = "true" ]; then
            echo "📝 번역이 필요한 글이 있습니다"
          else
            echo "✅ 모든 글이 번역되어 있습니다"
          fi

      - name: Translate articles (if needed)
        if: steps.check-translate.outputs.need_translate == 'true'
        run: |
          echo "🌐 번역 시작..."
          node translate-ai-blog.js
        timeout-minutes: 30

      - name: Build AIScroll
        run: |
          echo "🔨 빌드 시작..."
          node generate-ai-blog.js

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ai-docs/ data/ reports/ .ai-build-cache.json
          git diff --staged --quiet || git commit -m "Update AIScroll $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
