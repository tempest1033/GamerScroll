name: Build AIScroll

on:
  workflow_dispatch:
    inputs:
      skip_translate:
        description: '번역 스킵 (이미 번역된 경우)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout GamerScroll
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build AIScroll
        run: |
          if [ "${{ inputs.skip_translate }}" = "true" ]; then
            node generate-ai-blog.js --skip-translate
          else
            node generate-ai-blog.js
          fi

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ai-docs/ data/ reports/
          git diff --staged --quiet || git commit -m "Update AIScroll $(date +'%Y-%m-%d %H:%M')"
          git push
