name: Collect Global Rankings

# 전 국가 모바일 게임 순위(iOS/Android 매출·인기 200위) 수집 → snapshots/global/ 압축 저장.
# 자체 cron 은 없다: build.yml 의 2시간 간격 실행이 마지막 수집 후 11시간이 지났을 때 workflow_call 로 부른다(약 12시간마다).
# 한 번에 약 5.5분(Apple 요청을 1초 간격으로 직렬화) — 2시간마다 돌리면 월 2,000분 예산을 혼자 넘는다.
# workflow_dispatch 로 즉시 실행 가능.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankings-global
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Collect
        id: collect
        continue-on-error: true
        run: node scripts/collect-global-rankings.js --concurrency 10

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # snapshots/ 는 gitignore — 글로벌 스냅샷만 -f 로 커밋한다.
          git add -f snapshots/global/
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "Global rankings $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "::warning::push attempt $attempt failed; rebasing"
            git pull --rebase origin main || exit 1
          done
          echo "::error::push failed after 3 retries"
          exit 1

      # 부분 수집 파일과 진단 정보는 보존하되, 실행 자체는 성공으로 위장하지 않는다.
      - name: Check collection completeness
        if: steps.collect.outcome != 'success'
        run: |
          echo "::error::Global rankings collection was incomplete. See the job summary and snapshot run status."
          exit 1
