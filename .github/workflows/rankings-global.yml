name: Collect Global Rankings

# 전 국가 모바일 게임 순위(iOS/Android 매출·인기 200위) 수집 → snapshots/global/ 압축 저장.
# GitHub cron 은 지연·누락이 잦아 실제 간격은 2시간보다 길 수 있다. workflow_dispatch 로 즉시 실행 가능.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankings-global
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Collect
        run: node scripts/collect-global-rankings.js --concurrency 10

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # snapshots/ 는 gitignore — 글로벌 스냅샷만 -f 로 커밋한다.
          git add -f snapshots/global/
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "Global rankings $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "::warning::push attempt $attempt failed; rebasing"
            git pull --rebase origin main || exit 1
          done
          echo "::error::push failed after 3 retries"
          exit 1
