name: Generate Weekly Insight

on:
  schedule:
    - cron: '0 18 * * 0'  # 매주 일요일 UTC 18:00 → KST 월요일 03:00
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      force:
        description: '강제 재생성 (기존 리포트 덮어쓰기)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: weekly-insight
  cancel-in-progress: false

jobs:
  generate-weekly-insight:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull origin main --rebase || true

      - name: Check daily reports
        id: check-reports
        run: |
          REPORTS_COUNT=$(ls -1 reports/2*.json 2>/dev/null | wc -l)
          if [ "$REPORTS_COUNT" -gt 0 ]; then
            echo "reports_exist=true" >> $GITHUB_OUTPUT
            echo "📂 일일 리포트 ${REPORTS_COUNT}개 확인"
          else
            echo "reports_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️ 일일 리포트 없음 - ai-insight 워크플로우가 먼저 실행되어야 합니다"
          fi

      - name: Setup Node.js
        if: steps.check-reports.outputs.reports_exist == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check-reports.outputs.reports_exist == 'true'
        run: npm install --production

      - name: Generate Weekly Insight
        if: steps.check-reports.outputs.reports_exist == 'true'
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "📅 주간 인사이트 생성 시작..."
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            node generate-weekly-insight.js --force
          else
            node generate-weekly-insight.js
          fi
        timeout-minutes: 30

      - name: Finalize Weekly thumbnails (Codex)
        if: steps.check-reports.outputs.reports_exist == 'true'
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "🖼️ 주간 썸네일 후처리(Codex) 시작..."
          command -v codex >/dev/null 2>&1 || { echo "❌ codex CLI가 설치되어 있지 않습니다"; exit 1; }
          TARGET_FILE="$(ls -t reports/weekly/*.json 2>/dev/null | head -n 1)"
          if [ -z "$TARGET_FILE" ]; then
            echo "❌ 주간 리포트 파일을 찾지 못했습니다 (reports/weekly/*.json)"
            exit 1
          fi
          echo "🎯 대상 리포트: $TARGET_FILE"
          cat <<-PROMPT | codex exec -m gpt-5.3-codex -c model_reasoning_effort=xhigh -c hide_agent_reasoning=true --dangerously-bypass-approvals-and-sandbox -
          다음 JSON 파일의 썸네일 URL을 웹 검색으로 정확히 채워주세요.
          파일: ${TARGET_FILE}

          대상 필드(이외 수정 금지):
          - ai.thumbnail
          - ai.issues[].thumbnail
          - ai.industryIssues[].thumbnail
          - ai.metrics[].thumbnail
          - ai.global[].thumbnail

          규칙:
          - thumbnail은 반드시 https:// 로 시작하는 절대 URL만 사용(// 금지)
          - 제목/내용과 확실히 일치하는 기사/공식 이미지만 사용하고, 애매하면 null 유지
          - 다른 필드/키 순서/서식은 건드리지 말 것
          - git 명령은 절대 실행하지 말 것
          	PROMPT
        timeout-minutes: 30

      - name: Move weekly reports to docs
        if: steps.check-reports.outputs.reports_exist == 'true'
        run: |
          mkdir -p docs/reports/weekly
          if [ -d "reports/weekly" ]; then
            cp -r reports/weekly/*.json docs/reports/weekly/ 2>/dev/null || true
          fi

      - name: Commit and push
        if: steps.check-reports.outputs.reports_exist == 'true'
        run: |
          # 먼저 stash하고 pull
          git stash --include-untracked || true
          git pull origin main --rebase || true
          git stash pop || true
          # 그 다음 add & commit
          git add reports/weekly/ docs/reports/weekly/
          if git diff --staged --quiet; then
            echo "📝 변경사항 없음"
          else
            git commit -m "Weekly Insight $(date +'%Y-W%V')"
            git push
            echo "✅ 주간 인사이트 푸시 완료"
          fi
