name: Build and Deploy Report

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 실행
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: build-deploy-gamerscroll
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Pull latest changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main --depth=1
          git reset --hard origin/main || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        id: puppeteer-cache
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Puppeteer browser
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome

      - name: Download all images (wiki, tech, issue, insight, hotpick)
        run: node scripts/download-images.js


      - name: Generate report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          ADS_ENABLED: 'true'  # 광고 활성화
        run: node generate-html-report.js

      - name: Sync and enrich games
        run: node scripts/sync-and-enrich.js

      - name: Generate game pages
        env:
          ADS_ENABLED: 'true'  # 광고 활성화
        run: node scripts/generate-game-pages.js

      - name: Move report to docs
        run: |
          mkdir -p docs
          # MPA 모드: 폴더 구조로 복사 (clean URLs)
          cp index.html docs/index.html
          # 각 페이지를 폴더/index.html로
          for page in rankings steam upcoming; do
            mkdir -p docs/$page
          cp $page.html docs/$page/index.html
          done
          # CSS 복사 (styles.css → docs/)
          cp styles.css docs/ 2>/dev/null || true
          # 분리된 CSS 모듈(추가 요청) 복사
          if [ -d "src/styles" ]; then
            mkdir -p docs/styles
            cp -r src/styles/*.css docs/styles/ 2>/dev/null || true
          fi
          # 파비콘 및 아이콘 복사
          cp favicon-16x16.png docs/favicon-16x16.png
          cp favicon-32x32.png docs/favicon-32x32.png
          cp icon-192.png docs/icon-192.png
          # ads.txt 복사
          cp ads.txt docs/ads.txt
          # 네이버 사이트 인증 파일 복사
          cp naver7c3fb9852973561ab46756977b2f398e.html docs/naver7c3fb9852973561ab46756977b2f398e.html 2>/dev/null || true
          # CNAME 제거됨 - Cloudflare Pages 사용 (GitHub Pages 비활성화)
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # HARD INVARIANT: pathspec-restricted stash (artifacts only).
          # Never run `git stash push -u` without `--` — would swallow active user work
          # (2026-05-20 incident reset working tree twice).
          git stash push -u -m "ci-build-artifacts" -- docs/ data-cache.json .build-cache.json reports/ data/ history/ snapshots/ || true
          git pull origin main --rebase
          # Restore stash with `pop` (auto-drop on success). On conflict: abort,
          # do NOT use `checkout --ours` (loses upstream changes silently).
          if git stash list | grep -q "ci-build-artifacts"; then
            if ! git stash pop; then
              echo "::error::stash pop conflict — manual resolve required, aborting"
              exit 1
            fi
          fi
          git add docs/ reports/ data-cache.json .build-cache.json history/ data/ -f snapshots/
          git diff --staged --quiet || git commit -m "Update GamerScroll $(date +'%Y-%m-%d %H:%M')"
          # Race-safe push: retry up to 3 times with rebase on rejection.
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "::warning::push attempt $attempt failed; rebasing"
            git pull origin main --rebase || exit 1
          done
          echo "::error::push failed after 3 retries"
          exit 1
