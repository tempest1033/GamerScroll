name: Build and Deploy Report

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 실행
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Pull latest changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main --depth=1
          git reset --hard origin/main || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps=false

      - name: Generate report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: node generate-html-report.js

      - name: Sync and enrich games
        run: node scripts/sync-and-enrich.js

      - name: Generate game pages
        run: node scripts/generate-game-pages.js

      - name: Move report to docs
        run: |
          mkdir -p docs
          mkdir -p docs/reports
          # MPA 모드: 폴더 구조로 복사 (clean URLs)
          cp index.html docs/index.html
          # 각 페이지를 폴더/index.html로
          for page in news community youtube rankings steam upcoming metacritic; do
            mkdir -p docs/$page
          cp $page.html docs/$page/index.html
          done
          # 번들된 styles.css를 배포본으로 사용 (@import 미지원 환경 대응)
          cp styles.css docs/styles.css
          # 분리된 CSS 모듈(추가 요청) 복사
          if [ -d "src/styles" ]; then
            mkdir -p docs/styles
            cp -r src/styles/*.css docs/styles/ 2>/dev/null || true
          fi
          # 파비콘 및 아이콘 복사
          cp favicon-16x16.png docs/favicon-16x16.png
          cp favicon-32x32.png docs/favicon-32x32.png
          cp icon-192.png docs/icon-192.png
          echo "gamerscrawl.com" > docs/CNAME
          # 데일리 인사이트 리포트 복사 (JSON + HTML)
          if [ -d "reports" ]; then
            JSON_COUNT=$(ls reports/*.json 2>/dev/null | wc -l)
            HTML_COUNT=$(ls reports/*.html 2>/dev/null | wc -l)
            cp -r reports/*.json docs/reports/ 2>/dev/null || echo "⚠️ reports/*.json 복사 실패 또는 파일 없음"
            cp -r reports/*.html docs/reports/ 2>/dev/null || echo "⚠️ reports/*.html 복사 실패 또는 파일 없음"
            echo "📂 reports/ 복사: JSON ${JSON_COUNT}개, HTML ${HTML_COUNT}개"
          else
            echo "⚠️ reports/ 폴더 없음"
          fi
          # 주간 인사이트 리포트 복사
          if [ -d "reports/weekly" ]; then
            mkdir -p docs/reports/weekly
            WEEKLY_COUNT=$(ls reports/weekly/*.json 2>/dev/null | wc -l)
            cp -r reports/weekly/*.json docs/reports/weekly/ 2>/dev/null || echo "⚠️ weekly/*.json 복사 실패"
            echo "📂 reports/weekly/ 복사: JSON ${WEEKLY_COUNT}개"
          fi

      - name: Build Mobile version
        run: node build-mobile.js

      - name: Remove mobile ads from PC version
        run: node scripts/remove-mobile-ads.js

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git stash --include-untracked
          git pull origin main --rebase
          # stash pop, conflict 발생 시 새로 생성된 데이터(stash) 우선
          if ! git stash pop; then
            echo "⚠️ Conflict detected - using newly generated data"
            git checkout --ours data-cache.json 2>/dev/null || true
            git checkout --ours docs/ 2>/dev/null || true
            git add data-cache.json docs/
            git stash drop 2>/dev/null || true
          fi
          # conflict 마커 남아있으면 제거
          if grep -rq "<<<<<<" data-cache.json 2>/dev/null; then
            echo "⚠️ Removing conflict markers from data-cache.json"
            sed -i '/^<<<<<<</d; /^=======/d; /^>>>>>>>/d' data-cache.json
          fi
          git add docs/ docs-mobile/ reports/ data-cache.json history/ data/ -f snapshots/
          git diff --staged --quiet || git commit -m "Update report $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Deploy to Mobile repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd docs-mobile
          git init -b main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add origin https://x-access-token:${GH_PAT}@github.com/tempest1033/GamersCrawl-Mobile.git
          git add -A
          git commit -m "Update mobile $(date +'%Y-%m-%d %H:%M')"
          git push --force origin main
